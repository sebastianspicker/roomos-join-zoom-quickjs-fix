name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    name: Lint (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Prepare artifacts
        run: mkdir -p artifacts
      - name: Secret scan (basic)
        run: |
          set -euo pipefail
          if git ls-files -z | xargs -0 grep -IlE --exclude=.github/workflows/ci.yml -- '-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----|-----BEGIN PRIVATE KEY-----|AKIA[0-9A-Z]{16}|xox[baprs]-'; then
            echo "Potential secret patterns detected. Remove and rotate any exposed keys."
            exit 1
          fi
      - name: Lint
        run: |
          set -euo pipefail
          npm run smoke | tee artifacts/ci-smoke.log
      - name: Audit dependencies
        run: |
          set -euo pipefail
          npm audit --audit-level=low --json | tee artifacts/npm-audit.json
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-artifacts-node-${{ matrix.node }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
